name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Find build output
        run: |
          echo "Checking project files..."
          ls -la

          echo "Searching for index.html..."
          find . -maxdepth 4 -type f -name "index.html" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*"

      - name: Prepare GitHub Pages files
        run: |
          rm -rf site
          mkdir -p site

          if [ -f "dist/index.html" ]; then
            echo "Using dist folder"
            cp -R dist/. site/

          elif [ -f "build/index.html" ]; then
            echo "Using build folder"
            cp -R build/. site/

          else
            echo "Searching for generated index.html..."

            INDEX_FILE=$(find . -maxdepth 4 -type f -name "index.html" \
              -not -path "./node_modules/*" \
              -not -path "./.git/*" \
              -not -path "./public/*" \
              | head -n 1)

            if [ -z "$INDEX_FILE" ]; then
              echo "ERROR: No built index.html was found."
              exit 1
            fi

            echo "Found: $INDEX_FILE"

            BUILD_DIR=$(dirname "$INDEX_FILE")

            echo "Copying files from: $BUILD_DIR"

            cp -R "$BUILD_DIR"/. site/
          fi

          echo "Final GitHub Pages files:"
          ls -la site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
